name: Multipart Scene Groups
description: >-
  Links multipart scenes (pt1/pt2, cd1/cd2, A/B ...) in the same folder into a
  native Stash Group ordered by part number, and tags them Multipart. Scenes are
  no longer merged, so every part stays playable. Note: the VR button in the
  player is controlled natively by Settings → Interface → VR tag; this plugin
  only adds the VR tag when "Tag multipart scenes as VR" is enabled.
version: "2.0"
url: "https://github.com/ponponbon/ponponbon-stash-plugins"

exec:
  - python3
  - "{pluginDir}/merge_multipart_vr.py"

interface: raw

tasks:
  - name: Preview
    description: Log the groups, memberships and tags that would be created. Writes nothing.
    defaultArgs:
      mode: preview

  - name: Group Multipart Scenes
    description: Find or create a Group per multipart set and add each part with its part number.
    defaultArgs:
      mode: group

settings:
  api_key:
    displayName: API Key
    description: Optional. Use when Stash API auth is enabled.
    type: STRING

  stash_url:
    displayName: Stash URL
    description: Optional GraphQL URL override.
    type: STRING

  vr_tag:
    displayName: VR Tag Name
    description: Defaults to VR. Used by "VR Scenes Only" and "Tag multipart scenes as VR".
    type: STRING

  multipart_tag:
    displayName: Multipart Tag Name
    description: Defaults to Multipart.
    type: STRING

  vr_only:
    displayName: VR Scenes Only
    description: Only group scenes already tagged with the VR tag.
    type: BOOLEAN

  tag_as_vr:
    displayName: Tag multipart scenes as VR
    description: Off by default. When on, also adds the VR tag to every multipart scene.
    type: BOOLEAN

  update_delay_ms:
    displayName: Delay Between Updates (ms)
    description: Pause after each scene update. Defaults to 200.
    type: NUMBER
