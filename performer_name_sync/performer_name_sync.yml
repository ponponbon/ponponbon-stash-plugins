name: "Performer Name Sync"
description: >-
  For performers linked to JavStash: sets a romanized (Latin) display name from
  JavStash, keeps the old name as an alias, and links/enriches from a unique
  StashDB match. Run after Performer Cleanup, which handles duplicates, orphans
  and linking unlinked performers.
version: "1.25"
url: https://github.com/ponponbon/ponponbon-stash-plugins

exec:
  - python3
  - "{pluginDir}/performer_name_sync.py"

interface: raw

tasks:
  - name: "Sync Performer Names"
    description: Rename JavStash-linked performers to a Latin name and enrich from StashDB.
    defaultArgs:
      mode: "live"

  - name: "Preview"
    description: Log planned renames, StashDB links and enrichment. Writes nothing.
    defaultArgs:
      mode: "dry_run"

settings:
  api_key:
    displayName: API Key
    description: Optional. Use when Stash API auth is enabled.
    type: STRING
